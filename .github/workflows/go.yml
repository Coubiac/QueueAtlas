name: Go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Windows path snapshots
        run: go test ./internal/source/file -run '^Test(OpenLog|ValidateOpen|ObservePath|SourcePathFollow|OpenPathSnapshot|SelectRotation|RotationEntry)' -count=1
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', 'stable']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: File source race test
        if: matrix.go == '1.26.x'
        run: go test -race ./internal/source/file
      - name: Static Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
      - name: Static Linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
